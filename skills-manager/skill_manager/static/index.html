<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="skill-manager-base" content="">
  <title>Athena Skills</title>
  <style>
    :root { color-scheme: light; --border:#dfe3e8; --muted:#667085; --blue:#1769e0; --blue-bg:#edf4ff; --surface:#fff; --canvas:#f6f7f9; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:#202124; font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,textarea { font:inherit; }
    button { border:1px solid var(--border); border-radius:6px; background:#fff; color:#202124; cursor:pointer; padding:7px 11px; }
    button:hover { border-color:#9aa4b2; background:#f8fafc; }
    button.primary { border-color:var(--blue); background:var(--blue); color:#fff; }
    button.primary:hover { background:#125ac3; }
    button.danger { color:#b42318; }
    button:disabled { opacity:.45; cursor:default; }
    input[type="checkbox"] { width:16px; height:16px; margin:0; flex-shrink:0; accent-color:var(--blue); cursor:pointer; }
    input { border:1px solid var(--border); border-radius:6px; padding:8px 10px; background:#fff; }
    input:focus, textarea:focus { border-color:var(--blue); outline:2px solid #cfe0ff; }
    .topbar { min-height:64px; display:flex; align-items:center; justify-content:flex-start; gap:16px; padding:12px 24px; border-bottom:1px solid var(--border); background:var(--surface); }
    .brand { display:flex; align-items:center; gap:12px; min-width:220px; }
    .brand-mark { width:30px; height:30px; display:grid; place-items:center; border-radius:6px; background:#1f2937; color:#fff; font-weight:700; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:18px; }
    h2 { font-size:17px; }
    h3 { font-size:14px; }
    .muted { color:var(--muted); }
    .top-actions,.row { display:flex; align-items:center; gap:8px; }
    .top-actions { display:flex; flex:0 1 600px; justify-content:flex-end; width:100%; min-width:0; margin-left:auto; }
    .import-box { display:flex; align-items:center; gap:12px; width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; background:#f8fafc; }
    .source-tabs { display:flex; align-self:flex-start; gap:3px; padding:3px; border:1px solid var(--border); border-radius:7px; background:#fff; }
    .source-tab { border:1px solid transparent; border-radius:5px; padding:7px 13px; color:var(--muted); background:transparent; white-space:nowrap; }
    .source-tab:hover { background:#f2f4f7; }
    .source-tab.active { border-color:#c8d9f5; background:#e7efff; color:#1557b0; font-weight:600; }
    .import-method { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
    .import-method input { width:230px; min-width:0; }
    .import-method .git-option { width:125px; }
    #git-url { flex:1 1 auto; width:auto; }
    .zip-file { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
    .zip-file .file-picker { flex:1; }
    .import-method button.primary { flex-shrink:0; white-space:nowrap; }
    #zip-upload-method { width:100%; }
    #zip-upload-method .file-picker { flex:1 1 auto; }
    #zip-upload-method .upload-file-name { flex:1 1 auto; max-width:none; }
    .file-picker { display:flex; align-items:center; gap:8px; min-width:0; }
    .file-picker label { border:1px solid #98a2b3; border-radius:6px; padding:7px 10px; background:#fff; color:#344054; cursor:pointer; white-space:nowrap; }
    .file-picker label:hover { border-color:#9aa4b2; background:#f8fafc; }
    .upload-file-name { max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
    .layout { display:grid; grid-template-columns:300px minmax(0,1fr); min-height:calc(100vh - 65px); }
    .sidebar { border-right:1px solid var(--border); background:var(--surface); }
    .sidebar-head { padding:18px 16px 12px; border-bottom:1px solid var(--border); }
    .sidebar-head .row { margin-top:12px; }
    .sidebar-head input[type="search"] { width:100%; }
    .category-panel { padding:12px 16px; border-bottom:1px solid var(--border); }
    .category-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .category-head button { padding:3px 7px; font-size:12px; }
    .category-create { display:grid; gap:6px; margin-bottom:8px; padding:8px; border:1px solid var(--border); border-radius:6px; background:#f8fafc; }
    .category-create input { width:100%; padding:6px 8px; font-size:12px; }
    .category-list { display:grid; gap:2px; max-height:180px; overflow:auto; }
    .category-item { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; padding:6px 8px; border:0; border-radius:5px; text-align:left; background:transparent; color:#344054; }
    .category-item:hover { background:#f2f4f7; }
    .category-item.active { background:var(--blue-bg); color:#1557b0; font-weight:600; }
    .category-item small { color:var(--muted); font-weight:400; }
    .selection-bar { padding:12px 16px; border-bottom:1px solid var(--border); background:#fbfcfe; }
    .selection-bar label { display:flex; align-items:center; gap:8px; cursor:pointer; white-space:nowrap; }
    .selection-status { margin:8px 0 0; font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
    .selection-actions { display:flex; align-items:center; gap:6px; margin-left:auto; }
    .selection-actions button { height:26px; padding:3px 7px; font-size:12px; line-height:18px; white-space:nowrap; }
    .selection-actions select { height:26px; max-width:112px; padding:2px 5px; border:1px solid var(--border); border-radius:5px; background:#fff; color:#344054; font-size:12px; }
    .move-controls { display:flex; align-items:center; gap:5px; }
    .move-controls button { height:26px; padding:3px 7px; font-size:12px; }
    .row-move-controls { display:flex; align-items:center; gap:5px; margin-top:6px; padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:#f8fafc; }
    .row-move-controls select { flex:1; min-width:0; height:26px; padding:2px 5px; border:1px solid var(--border); border-radius:5px; background:#fff; font-size:12px; }
    .row-move-controls button { height:26px; padding:3px 7px; font-size:12px; }
    .skill-list { max-height:calc(100vh - 500px); overflow:auto; }
    .skill-group { border-bottom:1px solid #dfe3e8; }
    .skill-group > summary { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 16px; border-top:1px solid #dfe3e8; background:#f1f5f9; color:#1f2937; cursor:pointer; list-style-position:inside; font-weight:700; }
    .skill-group > summary .group-select { width:16px; height:16px; margin:0 5px 0 0; vertical-align:middle; }
    .skill-group > summary:hover { background:#e8eef5; }
    .skill-group > summary small { color:var(--muted); font-weight:400; }
    .category-controls { display:flex; align-items:center; gap:4px; margin-left:auto; opacity:0; pointer-events:none; }
    .skill-group:hover .category-controls,.skill-group:focus-within .category-controls,.skill-group.editing .category-controls { opacity:1; pointer-events:auto; }
    .category-controls button { padding:3px 6px; border:1px solid transparent; border-radius:4px; background:transparent; color:var(--muted); font-size:11px; font-weight:400; }
    .category-controls button:hover { border-color:var(--border); background:#fff; color:#344054; }
    .category-controls button.danger:hover { color:#b42318; }
    .category-edit-fields { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
    .category-edit-fields input { width:112px; min-width:0; padding:4px 7px; border:1px solid var(--blue); border-radius:4px; font:inherit; font-weight:600; }
    .category-edit-fields input.category-edit-slug { width:132px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:500; }
    .skill-group-items { border-top:1px solid #f2f4f7; background:#fff; }
    .skill-group-items .skill-item { padding-left:34px; border-left:3px solid #eef2f6; }
    .skill-group-items .skill-item.active { padding-left:31px; border-left-color:var(--blue); }
    .skill-item { display:flex; align-items:flex-start; gap:10px; width:100%; padding:13px 16px; border-bottom:1px solid #eef0f2; text-align:left; cursor:pointer; }
    .skill-item:hover { background:#f4f6f8; }
    .skill-item input { margin-top:2px; }
    .skill-open { display:block; min-width:0; flex:1; padding:0; border:0; background:transparent; text-align:left; }
    .skill-open:hover { background:transparent; }
    .skill-body { flex:1; min-width:0; }
    .skill-footer { position:relative; display:flex; align-items:center; gap:8px; margin-top:5px; min-height:28px; }
    .skill-footer small { flex:1; min-width:0; margin-top:0 !important; overflow:visible; text-overflow:clip; white-space:normal; overflow-wrap:anywhere; }
    .skill-actions { position:absolute; right:0; top:50%; display:flex; gap:4px; padding-left:6px; opacity:0; pointer-events:none; transform:translateY(-50%); background:#f4f6f8; }
    .skill-item:hover .skill-actions,.skill-item:focus-within .skill-actions { opacity:1; pointer-events:auto; }
    .skill-item.active .skill-actions { background:var(--blue-bg); }
    .skill-actions button { padding:4px 7px; font-size:12px; line-height:18px; }
    .skill-item.active { border-left:3px solid var(--blue); padding-left:13px; background:var(--blue-bg); }
    .skill-item strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .skill-item small { display:block; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
    .skill-name-edit { display:flex; align-items:center; gap:5px; min-width:0; }
    .skill-name-edit input { flex:1; min-width:0; padding:4px 7px; font-size:13px; }
    .skill-name-edit button { height:26px; padding:3px 7px; font-size:12px; white-space:nowrap; }
    .workspace { min-width:0; padding:22px 24px; }
    .empty { display:grid; min-height:420px; place-items:center; color:var(--muted); border:1px dashed #c8ced6; background:#fff; }
    .repo-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--border); }
    .repo-title { display:flex; align-items:center; gap:10px; }
    .repo-meta { margin-top:12px; color:var(--muted); font-size:12px; }
    .repo-body { display:grid; grid-template-columns:260px minmax(0,1fr); min-height:560px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#fff; }
    .tree { border-right:1px solid var(--border); overflow:auto; }
    .tree-head { padding:12px 14px; border-bottom:1px solid var(--border); font-weight:600; }
    .tree-node { display:block; width:100%; padding:6px 12px; border:0; border-radius:0; text-align:left; font-size:13px; }
    .tree-node:hover { background:#f4f6f8; }
    .tree-node.active { background:var(--blue-bg); color:#114da6; }
    .tree-node.dir { color:#475467; font-weight:600; }
    .tree-children { margin-left:13px; }
    .file-glyph { display:inline-block; width:22px; color:#98a2b3; }
    .viewer { min-width:0; display:flex; flex-direction:column; }
    .viewer-head { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px; padding:9px 14px; border-bottom:1px solid var(--border); }
    .file-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    .badge { padding:3px 7px; border-radius:4px; background:#f2f4f7; color:#667085; font-size:12px; white-space:nowrap; }
    .viewer-content { min-height:0; flex:1; overflow:auto; }
    textarea.editor { display:block; width:100%; min-height:505px; height:100%; resize:vertical; border:0; border-radius:0; padding:18px; outline:0; font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .preview { padding:22px 26px; min-height:505px; line-height:1.7; overflow:auto; }
    .preview h1,.preview h2,.preview h3 { margin:0 0 12px; }
    .preview h1 { font-size:26px; }.preview h2 { font-size:21px; }.preview h3 { font-size:17px; }
    .preview p,.preview ul,.preview ol,.preview pre,.preview blockquote { margin:0 0 14px; }
    .preview code { padding:2px 4px; border-radius:3px; background:#f2f4f7; font-family:ui-monospace,monospace; }
    .preview pre { padding:14px; overflow:auto; border-radius:6px; background:#111827; color:#e5e7eb; }
    .preview pre code { padding:0; background:transparent; }
    .preview blockquote { margin-left:0; padding-left:12px; border-left:3px solid #d0d5dd; color:#667085; }
    .preview a { color:var(--blue); }
    .media-preview { display:block; max-width:100%; max-height:620px; margin:24px auto; object-fit:contain; }
    .document-preview { width:100%; height:620px; border:0; }
    .binary { display:grid; place-items:center; min-height:505px; gap:12px; color:var(--muted); text-align:center; }
    .viewer-foot { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--border); }
    .hidden { display:none !important; }
    .notice { position:fixed; right:24px; bottom:24px; max-width:420px; padding:12px 16px; border:1px solid #b7c5d8; border-radius:7px; background:#fff; box-shadow:0 8px 24px #1018281a; }
    .notice.error { border-color:#f0b4ad; color:#b42318; }
    .history { margin-top:20px; border-top:1px solid var(--border); padding-top:16px; }
    .history table { width:100%; border-collapse:collapse; margin-top:10px; background:#fff; }
    .history th,.history td { padding:9px 10px; border-bottom:1px solid #eef0f2; text-align:left; font-size:12px; }
    @media (max-width:800px) {
      .topbar { align-items:flex-start; flex-direction:column; }
      .top-actions { flex:1 1 auto; width:100%; max-width:none; justify-content:flex-start; margin-left:0; }
      .import-box { width:100%; flex-wrap:wrap; }
      .source-tabs { width:max-content; }
      .import-method { width:100%; flex-wrap:wrap; }
      .import-method input { flex:1 1 220px; width:auto; }
      .import-method .git-option { flex:1 1 140px; width:auto; }
      .layout { display:block; }
      .sidebar { border-right:0; border-bottom:1px solid var(--border); }
      .skill-list { max-height:220px; }
      .workspace { padding:16px; }
      .repo-body { grid-template-columns:1fr; }
      .tree { max-height:260px; border-right:0; border-bottom:1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">S</div><div><h1>Skills</h1><div id="brand-summary" class="muted">全部 Skills 0 个</div></div></div>
    <div class="top-actions"><div class="import-box"><div class="source-tabs" role="tablist" aria-label="导入方式"><button id="zip-tab" class="source-tab active" role="tab" aria-selected="true" onclick="setSourceType('zip')">Zip 导入</button><button id="git-tab" class="source-tab" role="tab" aria-selected="false" onclick="setSourceType('git')">Git 导入</button></div><div id="zip-method" class="import-method"><div id="zip-upload-method" class="zip-file"><div class="file-picker"><label for="upload">选择压缩包</label><input id="upload" class="hidden" type="file" accept=".zip" onchange="updateUploadName()"><span id="upload-name" class="upload-file-name">未选择文件</span></div><button id="zip-import-button" class="primary" disabled onclick="uploadSkill()">导入</button></div></div><div id="git-method" class="import-method hidden"><input id="git-url" type="text" placeholder="git链接，建议ssh，如ssh://git@git.agoralab.co/xxx" oninput="updateGitImportState()"><input id="git-ref" class="git-option" type="text" placeholder="分支，如 main"><button id="git-import-button" class="primary" disabled onclick="importGitUrl()">导入</button></div></div></div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head"><div class="row"><input id="skill-search" type="search" placeholder="搜索 Skill" oninput="renderSkillList()"></div></div>
      <div class="category-panel"><div class="category-head"><h3>分类分组</h3><button id="new-category-button" class="hidden" onclick="toggleCategoryForm()">+ 新建</button></div><div id="category-create-form" class="category-create hidden"><input id="new-category-slug" placeholder="分类标识，例如 customer-private"><input id="new-category-zh" placeholder="中文名称，例如客户私有"><div class="row"><button class="primary" onclick="createCategory()">创建</button><button onclick="toggleCategoryForm(false)">取消</button></div></div></div>
      <div class="selection-bar">
        <div class="row"><label><input id="select-all" type="checkbox" onchange="selectVisibleSkills(this.checked)">全选</label><div class="selection-actions"><button id="move-skills" class="hidden" onclick="openMoveControls()" disabled>批量移动</button><div id="move-controls" class="move-controls hidden"><select id="move-category" aria-label="目标分类"><option value="">选择分类</option></select><button class="primary" onclick="confirmMoveSkills()">确定</button><button onclick="closeMoveControls()">取消</button></div><button id="download-skills" onclick="downloadSelectedSkills()" disabled>批量下载</button><button id="delete-skills" class="danger hidden" onclick="deleteSelectedSkills()" disabled>批量删除</button></div></div>
        <div id="selection-status" class="selection-status" aria-live="polite">已勾选 0 个 Skill</div>
      </div>
      <div id="skill-list" class="skill-list">加载中…</div>
    </aside>
    <main class="workspace">
      <div id="empty" class="empty">从左侧选择一个 Skill</div>
      <section id="repo" class="hidden">
        <div class="repo-head">
          <div><div class="repo-title"><h2 id="repo-name"></h2><span id="repo-version" class="badge"></span></div><div id="repo-meta" class="repo-meta"></div></div>
        </div>
        <div class="repo-body">
          <div class="tree"><div class="tree-head">文件</div><div id="file-tree"></div></div>
          <div class="viewer">
            <div class="viewer-head"><div class="row" style="min-width:0"><span id="file-name" class="file-name">请选择文件</span><span id="file-badge" class="badge hidden"></span></div><div id="mode-buttons" class="row hidden"><button id="source-button" onclick="setMode('source')">源码</button><button id="preview-button" onclick="setMode('preview')">预览</button></div></div>
            <div id="viewer-content" class="viewer-content"><div class="binary">请选择左侧文件</div></div>
            <div class="viewer-foot"><span id="file-info" class="muted"></span><div class="row"><a id="file-download" class="hidden" href="#" download><button>下载文件</button></a><button id="save-button" class="primary hidden" onclick="saveFile()">保存</button></div></div>
          </div>
        </div>
        <div class="history"><div class="row" style="justify-content:space-between"><h3>版本历史</h3><button onclick="loadHistory()">刷新</button></div><div id="history-list" class="muted">加载中…</div></div>
      </section>
    </main>
  </div>
  <div id="notice" class="notice hidden"></div>
  <script>
    let skills = [], categories = [], selectedCategory = 'all', openGroups = new Set(), editingCategory = null, editingSkillName = null, selectedSkill = null, selectedFile = null, skillVersion = null, fileContent = '', fileMode = 'source', selectionBusy = false, canManage = false;
    const checkedSkills = new Set();
    const $ = id => document.getElementById(id);
    $('skill-list').addEventListener('click', event => {
      const row = event.target.closest('.skill-item');
      if (row && !event.target.closest('button, input, select, .row-move-controls')) {
        row.querySelector('.skill-open').click();
      }
    });
    const deploymentBase = document.querySelector('meta[name="skill-manager-base"]').content;
    const appUrl = path => deploymentBase + path;
    const api = async (path, options = {}) => { const response = await fetch(appUrl(path), {credentials:'include', ...options}); const data = await response.json().catch(() => ({})); if (!response.ok) throw Error(data.detail || response.statusText); return data; };
    const fileUrl = (name, path) => appUrl('/api/skills/' + encodeURIComponent(name) + '/files/' + path.split('/').map(encodeURIComponent).join('/'));
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    function notify(message, error = false) { const node = $('notice'); node.textContent = message; node.className = 'notice' + (error ? ' error' : ''); setTimeout(() => node.classList.add('hidden'), 4500); }
    function formatBytes(size) { if (size < 1024) return size + ' B'; if (size < 1024 * 1024) return (size / 1024).toFixed(1) + ' KB'; return (size / 1024 / 1024).toFixed(1) + ' MB'; }
    function visibleSkills() { const query = $('skill-search').value.trim().toLowerCase(); return skills.filter(s => (selectedCategory === 'all' || s.category_slug === selectedCategory) && (!query || (s.name + ' ' + (s.name_zh || '') + ' ' + s.description).toLowerCase().includes(query))); }
    function selectionTargets() { return [...checkedSkills]; }
    function updateSelectionBar() {
      const visible = visibleSkills(), checkedVisible = visible.filter(s => checkedSkills.has(s.name)).length;
      $('select-all').checked = visible.length > 0 && checkedVisible === visible.length;
      $('select-all').indeterminate = checkedVisible > 0 && checkedVisible < visible.length;
      $('select-all').disabled = selectionBusy || !visible.length;
      $('selection-status').textContent = `已勾选 ${checkedSkills.size} 个 Skill`;
      $('move-category').innerHTML = '<option value="">选择分类</option>' + categories.map(c => `<option value="${escapeHtml(c.slug)}">${escapeHtml(c.name_zh || c.display_name || c.slug)}</option>`).join('');
      $('move-category').disabled = selectionBusy || !selectionTargets().length;
      $('move-skills').disabled = selectionBusy || !selectionTargets().length || !canManage;
      $('delete-skills').disabled = selectionBusy || !selectionTargets().length || !canManage;
      $('download-skills').disabled = selectionBusy || !selectionTargets().length;
      $('move-skills').classList.toggle('hidden', !canManage);
      $('delete-skills').classList.toggle('hidden', !canManage);
      $('new-category-button').classList.toggle('hidden', !canManage);
      updateGroupSelectionStates();
    }
    function skillRow(s) { const displayName = s.name_zh || s.name; const title = editingSkillName === s.name ? `<div class="skill-name-edit"><input id="skill-name-edit-${escapeHtml(s.name)}" value="${escapeHtml(displayName)}" aria-label="${escapeHtml(s.name)}中文名称" onkeydown="if(event.key==='Enter') saveSkillName('${s.name}'); if(event.key==='Escape') cancelSkillNameEdit()"><button class="primary" onclick="saveSkillName('${s.name}')">保存</button><button onclick="cancelSkillNameEdit()">取消</button></div>` : `<button class="skill-open" onclick="openSkill('${s.name}')"><strong>${escapeHtml(displayName)}</strong></button>`; return `<div class="skill-item ${s.name === selectedSkill ? 'active' : ''}"><input class="skill-select" data-skill-name="${escapeHtml(s.name)}" type="checkbox" aria-label="勾选 ${escapeHtml(displayName)}" ${checkedSkills.has(s.name) ? 'checked' : ''} ${selectionBusy ? 'disabled' : ''} onchange="toggleCheckedSkill('${s.name}', this.checked)"><div class="skill-body">${title}<div class="skill-footer"><small>v${s.version} · ${escapeHtml(s.name)}</small><div class="skill-actions"><button aria-label="改名 ${escapeHtml(displayName)}" title="改名" ${selectionBusy ? 'disabled' : ''} onclick="beginSkillNameEdit(event, '${s.name}')">改名</button><button aria-label="移动 ${s.name}" title="移动 ${s.name}" ${selectionBusy ? 'disabled' : ''} onclick="openRowMoveControls('${s.name}')">移动</button><button aria-label="下载 ${s.name}" title="下载 ${s.name}" ${selectionBusy ? 'disabled' : ''} onclick="downloadSelectedSkills('${s.name}')">下载</button><button class="danger" aria-label="删除 ${s.name}" title="删除 ${s.name}" ${selectionBusy ? 'disabled' : ''} onclick="deleteSelectedSkills('${s.name}')">删除</button></div></div><div id="row-move-${s.name}" class="row-move-controls hidden"><select aria-label="${escapeHtml(s.name)}目标分类"><option value="">选择分类</option>${categories.map(c => `<option value="${escapeHtml(c.slug)}">${escapeHtml(c.name_zh || c.display_name || c.slug)}</option>`).join('')}</select><button class="primary" onclick="confirmRowMove('${s.name}')">确定</button><button onclick="closeRowMoveControls('${s.name}')">取消</button></div></div></div>`; }
    function renderSkillList() {
      const visible = visibleSkills(); if ($('skill-count')) $('skill-count').textContent = visible.length + ' 个'; $('brand-summary').textContent = `全部 Skills ${skills.length} 个`;
      const categoryNames = Object.fromEntries(categories.map(c => [c.slug, c.name_zh || c.display_name || c.slug]));
      const groups = new Map();
      visible.forEach(skill => { const category = skill.category_slug || 'general'; if (!groups.has(category)) groups.set(category, []); groups.get(category).push(skill); });
      const orderedCategories = [...categories.map(c => c.slug), ...[...groups.keys()].filter(slug => !categories.some(c => c.slug === slug))];
      const markup = orderedCategories.map(category => { const groupSkills = groups.get(category) || []; const groupChecked = groupSkills.length > 0 && groupSkills.every(skill => checkedSkills.has(skill.name)); const displayName = categoryNames[category] || category; const isSystem = category === 'general'; const title = editingCategory === category ? `<span class="category-edit-fields"><input id="category-edit-slug-${escapeHtml(category)}" class="category-edit-slug" placeholder="分类标识" onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter') saveCategoryEdit('${escapeHtml(category)}'); if(event.key==='Escape') cancelCategoryEdit()"><input id="category-edit-zh-${escapeHtml(category)}" placeholder="中文名称" onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter') saveCategoryEdit('${escapeHtml(category)}'); if(event.key==='Escape') cancelCategoryEdit()"></span>` : escapeHtml(displayName); const controls = canManage && !isSystem && editingCategory !== category ? `<span class="category-controls"><button onclick="beginCategoryEdit(event, '${escapeHtml(category)}')">改名</button><button class="danger" onclick="removeCategory(event, '${escapeHtml(category)}')">删除</button></span>` : canManage && editingCategory === category ? `<span class="category-controls"><button class="primary" onclick="saveCategoryEdit('${escapeHtml(category)}')">保存</button><button onclick="cancelCategoryEdit()">取消</button></span>` : ''; return `<details class="skill-group ${editingCategory === category ? 'editing' : ''}" ${openGroups.has(category) ? 'open' : ''} ontoggle="toggleGroupOpen('${escapeHtml(category)}', this.open)"><summary><span class="row"><input class="group-select" type="checkbox" data-category="${escapeHtml(category)}" ${groupChecked ? 'checked' : ''} ${groupSkills.length ? '' : 'disabled'} onclick="event.stopPropagation()" onchange="toggleGroupSkills(event, '${escapeHtml(category)}', this.checked)">${title}</span>${controls}<small>${groupSkills.length}</small></summary><div class="skill-group-items">${groupSkills.length ? groupSkills.map(skillRow).join('') : '<div class="muted" style="padding:12px 16px">暂无 Skills</div>'}</div></details>`; }).join('');
      $('skill-list').innerHTML = markup || '<div class="muted" style="padding:16px">没有匹配的 Skill</div>';
      if (editingCategory) {
        const editingData = categories.find(item => item.slug === editingCategory);
        const slugInput = $('category-edit-slug-' + editingCategory);
        const zhInput = $('category-edit-zh-' + editingCategory);
        if (slugInput && zhInput && editingData) {
          slugInput.value = editingData.slug || editingCategory;
          zhInput.value = editingData.name_zh || editingData.display_name || editingCategory;
        }
      }
      updateSelectionBar();
    }
    function toggleGroupOpen(category, open) { if (open) openGroups.add(category); else openGroups.delete(category); }
    function groupVisibleSkills(category) { return visibleSkills().filter(skill => (skill.category_slug || 'general') === category); }
    function toggleGroupSkills(event, category, checked) { event.stopPropagation(); groupVisibleSkills(category).forEach(skill => { if (checked) checkedSkills.add(skill.name); else checkedSkills.delete(skill.name); const input = document.querySelector(`.skill-select[data-skill-name="${skill.name}"]`); if (input) input.checked = checked; }); updateSelectionBar(); }
    function updateGroupSelectionStates() { document.querySelectorAll('.group-select').forEach(input => { const group = groupVisibleSkills(input.dataset.category); const checked = group.filter(skill => checkedSkills.has(skill.name)).length; input.checked = group.length > 0 && checked === group.length; input.indeterminate = checked > 0 && checked < group.length; }); }
    function beginCategoryEdit(event, slug) { event.preventDefault(); event.stopPropagation(); editingCategory = slug; openGroups.add(slug); renderSkillList(); setTimeout(() => { const category = categories.find(item => item.slug === slug); const slugInput = $('category-edit-slug-' + slug); const zhInput = $('category-edit-zh-' + slug); if (category && slugInput && zhInput) { slugInput.value = category.slug || slug; zhInput.value = category.name_zh || category.display_name || slug; zhInput.focus(); zhInput.selectionStart = zhInput.selectionEnd = zhInput.value.length; } }, 0); }
    function cancelCategoryEdit() { editingCategory = null; renderSkillList(); }
    async function saveCategoryEdit(slug) { if (!canManage) return notify('没有分类管理权限', true); const slugInput = $('category-edit-slug-' + slug); const zhInput = $('category-edit-zh-' + slug); const newSlug = slugInput?.value.trim(); const nameZh = zhInput?.value.trim(); if (!newSlug || !nameZh) return notify('请填写分类标识和中文名称', true); try { await api('/api/categories/' + encodeURIComponent(slug), {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({slug:newSlug, name_zh:nameZh})}); editingCategory = null; if (openGroups.has(slug)) { openGroups.delete(slug); openGroups.add(newSlug); } if (selectedCategory === slug) selectedCategory = newSlug; await loadCategories(); await loadSkills(); notify('分类信息已更新'); } catch (error) { notify(error.message, true); } }
    async function removeCategory(event, slug) { event.preventDefault(); event.stopPropagation(); if (!canManage) return notify('没有分类管理权限', true); const category = categories.find(item => item.slug === slug); const count = category?.skill_count || 0; if (!confirm(`删除分类 ${category?.name_zh || category?.display_name || slug}？${count ? `\n其中 ${count} 个 Skill 将移动到 general。` : ''}`)) return; try { await api('/api/categories/' + encodeURIComponent(slug), {method:'DELETE'}); if (selectedCategory === slug) selectedCategory = 'all'; openGroups.delete(slug); await loadCategories(); await loadSkills(); notify('分类已删除'); } catch (error) { notify(error.message, true); } }
    function toggleCheckedSkill(name, checked) { if (checked) checkedSkills.add(name); else checkedSkills.delete(name); updateSelectionBar(); }
    function selectVisibleSkills(checked) { visibleSkills().forEach(s => checked ? checkedSkills.add(s.name) : checkedSkills.delete(s.name)); renderSkillList(); }
    function selectCategory(slug) { selectedCategory = slug; renderSkillList(); }
    function toggleCategoryForm(show = null) { const form = $('category-create-form'); const shouldShow = show === null ? form.classList.contains('hidden') : show; form.classList.toggle('hidden', !shouldShow); if (shouldShow) $('new-category-slug').focus(); else { $('new-category-slug').value = ''; $('new-category-zh').value = ''; } }
    async function createCategory() { if (!canManage) return notify('没有分类管理权限', true); const slug = $('new-category-slug').value.trim(); const nameZh = $('new-category-zh').value.trim(); if (!slug || !nameZh) return notify('请填写分类标识和中文名称', true); try { await api('/api/categories', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({slug, name_zh:nameZh})}); toggleCategoryForm(false); await loadCategories(); notify('分类创建成功'); } catch (error) { notify(error.message, true); } }
    async function loadMe() { const data = await api('/api/me'); canManage = data.can_manage === true; }
    async function loadCategories() { const data = await api('/api/categories'); categories = data.categories; renderSkillList(); }
    function closeSkill() { selectedSkill = null; selectedFile = null; skillVersion = null; $('repo').classList.add('hidden'); $('empty').classList.remove('hidden'); }
    async function loadSkills() { const data = await api('/api/skills'); skills = data.skills; const names = new Set(skills.map(s => s.name)); for (const name of checkedSkills) if (!names.has(name)) checkedSkills.delete(name); if (selectedSkill && !names.has(selectedSkill)) closeSkill(); renderSkillList(); }
    function buildTree(files) { const root = {dirs:{}, files:[]}; files.forEach(file => { let node = root; const parts = file.path.split('/'); parts.forEach((part, index) => { if (index === parts.length - 1) node.files.push(file); else node = node.dirs[part] ||= {dirs:{}, files:[]}; }); }); return root; }
    function renderTree() { const root = buildTree($('repo')._files); const container = $('file-tree'); container.replaceChildren(); const render = (node, parent, depth) => { Object.keys(node.dirs).sort().forEach(name => { const button = document.createElement('button'); button.className = 'tree-node dir'; button.style.paddingLeft = (12 + depth * 14) + 'px'; button.textContent = '▾  ' + name; parent.append(button); const children = document.createElement('div'); children.className = 'tree-children'; parent.append(children); render(node.dirs[name], children, depth + 1); }); node.files.sort((a,b) => a.name.localeCompare(b.name)).forEach(file => { const button = document.createElement('button'); button.className = 'tree-node' + (file.path === selectedFile ? ' active' : ''); button.style.paddingLeft = (12 + depth * 14) + 'px'; button.innerHTML = `<span class="file-glyph">${file.is_text ? '▤' : '◻'}</span>${escapeHtml(file.name)}`; button.onclick = () => openFile(file); parent.append(button); }); }; render(root, container, 0); }
    function beginSkillNameEdit(event, name) { event.preventDefault(); event.stopPropagation(); editingSkillName = name; renderSkillList(); setTimeout(() => { const input = $('skill-name-edit-' + name); if (input) { input.focus(); input.select(); } }, 0); }
    function cancelSkillNameEdit() { editingSkillName = null; renderSkillList(); }
    async function saveSkillName(name) { const input = $('skill-name-edit-' + name); const nameZh = input?.value.trim(); if (!nameZh) return notify('请输入 Skill 中文名称', true); try { await api('/api/skills/' + encodeURIComponent(name) + '/name', {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name_zh:nameZh})}); editingSkillName = null; await loadSkills(); if (selectedSkill === name) $('repo-name').textContent = nameZh; notify('Skill 名称已更新'); } catch (error) { notify(error.message, true); } }
    async function openSkill(name) { try { const data = await api('/api/skills/' + encodeURIComponent(name)); selectedSkill = name; editingSkillName = null; skillVersion = data.skill.version; $('repo')._files = data.files; selectedFile = null; $('empty').classList.add('hidden'); $('repo').classList.remove('hidden'); $('repo-name').textContent = data.skill.name_zh || name; $('repo-version').textContent = 'v' + skillVersion; $('repo-meta').textContent = `Skill ID ${name} · 创建者 ${data.skill.created_by} · 最后修改 ${data.skill.updated_by} · ${data.files.length} 个文件`; renderSkillList(); renderTree(); const first = data.files.find(file => file.path === 'SKILL.md') || data.files[0]; if (first) await openFile(first); await loadHistory(); } catch (error) { notify(error.message, true); } }
    async function openFile(file) { try { selectedFile = file.path; renderTree(); $('file-name').textContent = file.path; $('file-badge').textContent = file.is_text ? '文本' : file.mime_type; $('file-badge').classList.remove('hidden'); $('file-info').textContent = `${formatBytes(file.size_bytes)} · ${file.mime_type}`; const url = fileUrl(selectedSkill, file.path); $('file-download').href = url; $('file-download').classList.remove('hidden'); $('save-button').classList.add('hidden'); $('mode-buttons').classList.add('hidden'); $('viewer-content').replaceChildren(); if (file.is_text) { const response = await fetch(url, {credentials:'include'}); if (!response.ok) throw Error('文件读取失败'); fileContent = await response.text(); fileMode = 'source'; $('mode-buttons').classList.remove('hidden'); $('source-button').classList.add('primary'); $('preview-button').classList.remove('primary'); renderTextFile(file); } else if (file.mime_type.startsWith('image/')) { const image = document.createElement('img'); image.className = 'media-preview'; image.src = url; image.alt = file.name; $('viewer-content').append(image); } else if (file.mime_type === 'application/pdf') { const frame = document.createElement('iframe'); frame.className = 'document-preview'; frame.src = url; frame.title = file.name; $('viewer-content').append(frame); } else { $('viewer-content').innerHTML = `<div class="binary"><div>该文件不能直接预览</div><a href="${url}" download>下载 ${escapeHtml(file.name)}</a></div>`; } } catch (error) { notify(error.message, true); } }
    function renderTextFile(file) { const content = $('viewer-content'); content.replaceChildren(); if (fileMode === 'preview' && file.path.toLowerCase().endsWith('.md')) { const preview = document.createElement('article'); preview.className = 'preview'; preview.innerHTML = markdownToHtml(fileContent); content.append(preview); $('save-button').classList.add('hidden'); return; } const editor = document.createElement('textarea'); editor.className = 'editor'; editor.value = fileContent; editor.oninput = () => { fileContent = editor.value; $('save-button').classList.remove('hidden'); }; content.append(editor); $('save-button').classList.remove('hidden'); }
    function setMode(mode) { fileMode = mode; $('source-button').classList.toggle('primary', mode === 'source'); $('preview-button').classList.toggle('primary', mode === 'preview'); const file = $('repo')._files.find(item => item.path === selectedFile); if (file) renderTextFile(file); }
    function markdownInline(text) { return escapeHtml(text).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>'); }
    function markdownToHtml(source) { const lines = source.split(/\r?\n/), output = []; let inCode = false, code = [], list = false; const closeList = () => { if (list) { output.push('</ul>'); list = false; } }; lines.forEach(line => { if (line.startsWith('```')) { closeList(); if (inCode) { output.push('<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>'); code = []; } inCode = !inCode; return; } if (inCode) { code.push(line); return; } if (!line.trim()) { closeList(); return; } const heading = line.match(/^(#{1,3})\s+(.+)$/); if (heading) { closeList(); output.push(`<h${heading[1].length}>${markdownInline(heading[2])}</h${heading[1].length}>`); return; } const item = line.match(/^[-*]\s+(.+)$/); if (item) { if (!list) { output.push('<ul>'); list = true; } output.push('<li>' + markdownInline(item[1]) + '</li>'); return; } closeList(); if (line.startsWith('> ')) output.push('<blockquote>' + markdownInline(line.slice(2)) + '</blockquote>'); else output.push('<p>' + markdownInline(line) + '</p>'); }); closeList(); if (inCode) output.push('<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>'); return output.join(''); }
    async function saveFile() { if (!selectedSkill || !selectedFile) return; try { await api('/api/skills/' + encodeURIComponent(selectedSkill), {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({files:{[selectedFile]:fileContent}, base_version:skillVersion, message:'Online edit'})}); notify('文件保存成功'); await openSkill(selectedSkill); } catch (error) { notify(error.message, true); } }
    async function loadHistory() { if (!selectedSkill) return; try { const data = await api('/api/skills/' + encodeURIComponent(selectedSkill) + '/history'); $('history-list').innerHTML = data.history.length ? `<table><thead><tr><th>版本</th><th>操作人</th><th>说明</th><th>时间</th></tr></thead><tbody>${data.history.map(item => `<tr><td>v${item.version}</td><td>${escapeHtml(item.actor_id)}</td><td>${escapeHtml(item.message)}</td><td>${new Date(item.created_at).toLocaleString()}</td></tr>`).join('')}</tbody></table>` : '暂无版本历史'; } catch (error) { $('history-list').textContent = error.message; } }
    function setSourceType(type) { const git = type === 'git'; $('zip-method').classList.toggle('hidden', git); $('git-method').classList.toggle('hidden', !git); $('zip-tab').classList.toggle('active', !git); $('git-tab').classList.toggle('active', git); $('zip-tab').setAttribute('aria-selected', String(!git)); $('git-tab').setAttribute('aria-selected', String(git)); updateUploadName(); updateGitImportState(); }
    function updateUploadName() { const file = $('upload').files[0]; $('upload-name').textContent = file ? file.name : '未选择文件'; $('zip-import-button').disabled = !file; }
    function updateGitImportState() { $('git-import-button').disabled = !$('git-url').value.trim(); }
    function importSummary(data) { const summary = data.summary; return `导入完成：创建 ${summary.created}，更新 ${summary.updated}，跳过 ${summary.skipped}，失败 ${summary.failed}`; }
    async function openFirstImported(data) { const first = (data.skills || []).find(item => item.status === 'created' || item.status === 'updated'); selectedCategory = 'all'; await loadCategories(); await loadSkills(); if (first) await openSkill(first.name); notify(importSummary(data), data.summary.failed > 0); }
    async function uploadSkill() { const file = $('upload').files[0]; if (!file) return notify('请选择 Zip 文件', true); const form = new FormData(); form.append('file', file); try { const data = await api('/api/skills', {method:'POST', body:form}); $('upload').value = ''; updateUploadName(); await openFirstImported(data); } catch (error) { notify(error.message, true); } }
    async function importGitUrl() { const url = $('git-url').value.trim(); if (!url) return notify('请输入 Git 仓库链接', true); try { const payload = {url, ref:$('git-ref').value.trim() || null}; const data = await api('/api/skills/import-git', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); $('git-url').value = ''; $('git-ref').value = ''; updateGitImportState(); await openFirstImported(data); } catch (error) { notify(error.message, true); } }
    function openMoveControls(name = null) { if (!canManage) return notify('没有批量移动权限', true); if (name) { checkedSkills.clear(); checkedSkills.add(name); updateSelectionBar(); } if (!selectionTargets().length) return; $('move-controls').classList.remove('hidden'); $('move-skills').classList.add('hidden'); $('move-category').focus(); }
    function closeMoveControls() { $('move-controls').classList.add('hidden'); $('move-skills').classList.remove('hidden'); $('move-category').value = ''; }
    function openRowMoveControls(name) { const row = $('row-move-' + name); if (!row) return; row.classList.remove('hidden'); row.querySelector('select').focus(); }
    function closeRowMoveControls(name) { const row = $('row-move-' + name); if (row) { row.classList.add('hidden'); row.querySelector('select').value = ''; } }
    async function confirmRowMove(name) { const row = $('row-move-' + name); const category = row?.querySelector('select')?.value; if (!category) return notify('请选择目标分类', true); selectionBusy = true; renderSkillList(); try { await api('/api/skills/' + encodeURIComponent(name) + '/category', {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({category})}); await loadCategories(); await loadSkills(); notify('Skill 移动成功'); } catch (error) { notify(error.message, true); } finally { selectionBusy = false; renderSkillList(); } }
    async function confirmMoveSkills() { if (!canManage) return notify('没有批量移动权限', true); const names = selectionTargets(); const category = $('move-category').value; if (!names.length) return; if (!category) return notify('请选择目标分类', true); selectionBusy = true; renderSkillList(); try { const data = await api('/api/skills/batch-category', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({names, category})}); checkedSkills.clear(); closeMoveControls(); await loadCategories(); await loadSkills(); notify(`已移动 ${data.count} 个 Skill`); } catch (error) { notify(error.message, true); } finally { selectionBusy = false; renderSkillList(); } }
    async function downloadSelectedSkills(name = null) {
      const names = name ? [name] : selectionTargets(); if (!names.length || selectionBusy) return;
      selectionBusy = true; renderSkillList();
      try {
        const path = names.length === 1 ? '/api/skills/' + encodeURIComponent(names[0]) + '/download' : '/api/skills/batch-download';
        const response = await fetch(appUrl(path), names.length === 1 ? {credentials:'include'} : {credentials:'include', method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({names})});
        if (!response.ok) { const data = await response.json().catch(() => ({})); throw Error(data.detail || response.statusText); }
        const url = URL.createObjectURL(await response.blob()), link = document.createElement('a'); link.href = url; link.download = names.length === 1 ? names[0] + '.zip' : 'skills.zip'; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (error) { notify(error.message, true); } finally { selectionBusy = false; renderSkillList(); }
    }
    async function deleteSelectedSkills(name = null) {
      if (!name && !canManage) return notify('没有批量删除权限', true);
      const names = name ? [name] : selectionTargets(); if (!names.length || selectionBusy || !confirm(`确定删除以下 ${names.length} 个 Skill？\n\n${names.join('\n')}`)) return;
      selectionBusy = true; renderSkillList();
      try {
        const data = name
          ? await api('/api/skills/' + encodeURIComponent(name), {method:'DELETE'})
          : await api('/api/skills/batch-delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({names})});
        const deleted = name ? [name] : data.deleted;
        deleted.forEach(item => checkedSkills.delete(item)); if (deleted.includes(selectedSkill)) closeSkill(); await loadSkills(); notify(`已删除 ${deleted.length} 个 Skill`);
      } catch (error) { notify(error.message, true); } finally { selectionBusy = false; renderSkillList(); }
    }
    async function load() { try { await loadMe(); await loadCategories(); await loadSkills(); } catch (error) { notify(error.message, true); } }
    load();
  </script>
