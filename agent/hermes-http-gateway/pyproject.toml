[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-http-gateway"
version = "0.1.0"
description = "External HTTP gateway for Hermes with user/session isolation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
hermes-http-gateway = "hermes_http_gateway.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
