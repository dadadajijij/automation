<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Athena Skills 管理</title><style>body{font:14px system-ui;margin:0;background:#f6f7f9;color:#202124}main{max-width:1100px;margin:32px auto;padding:0 20px}.bar,.card{background:#fff;border:1px solid #e2e5e9;border-radius:10px;padding:18px;margin:12px 0}.bar{display:flex;justify-content:space-between;align-items:center}button{padding:8px 14px;border:0;border-radius:6px;background:#2563eb;color:white;cursor:pointer}button.danger{background:#dc2626}input,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccd1d8;border-radius:6px}textarea{min-height:320px;font-family:monospace}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.skill{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.skill.active{background:#eef4ff}.muted{color:#667085}.row{display:flex;gap:8px;align-items:center}.hidden{display:none}</style></head><body><main><div class="bar"><div><h1>Athena Skills</h1><div id="user" class="muted">正在获取登录信息…</div></div><div class="row"><input id="upload" type="file" accept=".zip"><button onclick="upload()">上传 ZIP</button></div></div><div id="msg" class="card hidden"></div><div class="grid"><div class="card"><h3>共享 Skills</h3><div id="list">加载中…</div></div><div class="card"><div id="empty">选择一个 Skill 查看或编辑</div><div id="editor" class="hidden"><div class="row"><h2 id="title"></h2><span id="meta" class="muted"></span></div><textarea id="content"></textarea><p><button onclick="save()">保存</button> <button class="danger" onclick="removeSkill()">删除</button> <a id="download">下载 ZIP</a></p></div></div></div></main><script>let selected=null,version=null;const $=id=>document.getElementById(id);async function api(url,opt={}){let r=await fetch(url,{credentials:'include',...opt});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||r.statusText);return d}function show(s){$('msg').textContent=s;$('msg').classList.remove('hidden');setTimeout(()=>$('msg').classList.add('hidden'),4000)}async function load(){try{let me=await api('/api/me');$('user').textContent=`${me.user.display_name} (${me.user.email})`;await list()}catch(e){$('user').textContent=e.message}}async function list(){let d=await api('/api/skills');$('list').innerHTML=d.skills.map(s=>`<div class="skill ${s.name===selected?'active':''}" onclick="openSkill('${s.name}')"><b>${s.name}</b><br><span class="muted">v${s.version} · ${s.description||'无描述'}</span></div>`).join('')||'<span class="muted">暂无 Skills</span>'}async function openSkill(n){let d=await api('/api/skills/'+encodeURIComponent(n));selected=n;version=d.skill.version;$('empty').classList.add('hidden');$('editor').classList.remove('hidden');$('title').textContent=n;$('meta').textContent=`v${version} · 最后修改：${d.skill.updated_by}`;$('content').value=d.files['SKILL.md']||'';$('download').href='/api/skills/'+encodeURIComponent(n)+'/download';await list()}async function save(){try{await api('/api/skills/'+encodeURIComponent(selected),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:{'SKILL.md':$('content').value},base_version:version,message:'Online edit'})});show('保存成功');await openSkill(selected)}catch(e){show(e.message)}}async function removeSkill(){if(!selected||!confirm(`确定删除 ${selected}？`))return;try{await api('/api/skills/'+encodeURIComponent(selected),{method:'DELETE'});selected=null;$('editor').classList.add('hidden');$('empty').classList.remove('hidden');show('已删除');await list()}catch(e){show(e.message)}}async function upload(){let f=$('upload').files[0];if(!f)return show('请选择 ZIP 文件');let fd=new FormData();fd.append('file',f);try{let d=await api('/api/skills',{method:'POST',body:fd});show(`上传成功：${d.skill.name}`);$('upload').value='';await list();await openSkill(d.skill.name)}catch(e){show(e.message)}}load()</script></body></html>
